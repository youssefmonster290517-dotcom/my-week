
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY WEEK – Y MANKOUR</title>
<style>
:root {
  --bg:#0b1220;
  --panel:#151f32;
  --card:#1d2a40;
  --accent:#54d6e8;
  --purple:#8585ff;
  --text:#f5f7ff;
  --muted:#9baac2;
  --border:#2b3951;
  --green:#42d6a0;
  --red:#ff7185;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1150px;margin:auto;padding:22px}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:50px;height:50px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  color:#071321;font-size:25px;font-weight:bold;
  display:grid;place-items:center;
}
h1{font-size:24px;margin:0}
.brand p{color:var(--muted);font-size:12px;margin:6px 0 0}
#today{color:var(--muted);font-size:13px}
.hero{
  background:linear-gradient(120deg,#193b55,#282b54);
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.hero h2{margin:0 0 10px;font-size:27px}
.hero p{color:#c6d3e7;margin:0;line-height:1.7}
.progress{
  width:100px;height:100px;flex:none;
  border-radius:50%;
  background:conic-gradient(var(--accent) var(--percent,0%),#ffffff20 0);
  display:grid;place-items:center;
  position:relative;
}
.progress:before{
  content:"";position:absolute;inset:9px;
  border-radius:50%;background:#203553;
}
.progress strong{position:relative;font-size:21px}
.progress-area{text-align:center}
.progress-area small{display:block;margin-top:8px;color:#c6d3e7}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
  margin:18px 0 27px;
}
.stat,.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:17px;
}
.stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
.stat strong{font-size:25px}
.toolbar{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:14px;
}
.toolbar h2{font-size:20px;margin:0}
.controls{display:flex;align-items:center;gap:7px}
.btn{
  background:var(--card);color:var(--text);
  border:1px solid var(--border);
  border-radius:11px;padding:11px 14px;
}
.btn:hover{filter:brightness(1.2)}
.primary{
  background:linear-gradient(120deg,var(--accent),#7daaff);
  color:#071321;border:0;font-weight:bold;
}
#weekLabel{color:var(--muted);font-size:13px;min-width:125px;text-align:center}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:9px;margin-bottom:17px;
}
.day{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 5px;
  min-height:75px;
}
.day span{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}
.day strong{font-size:18px}
.day.active{border-color:var(--accent);background:#174052}
.day.today strong{color:var(--accent)}
.layout{
  display:grid;
  grid-template-columns:1.5fr 0.85fr;
  gap:16px;
  align-items:start;
}
.panel h3{margin:0;font-size:17px}
.panel-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:15px;gap:10px;
}
.muted{font-size:12px;color:var(--muted)}
.task-list{display:grid;gap:10px}
.task{
  display:flex;align-items:center;gap:11px;
  background:var(--card);
  border:1px solid #ffffff0c;
  border-radius:13px;padding:13px;
}
.task input{width:21px;height:21px;accent-color:var(--green)}
.task-main{flex:1;min-width:0}
.task-name{font-size:14px;overflow-wrap:anywhere}
.task.done .task-name{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);background:#ffffff12;padding:5px 8px;border-radius:20px}
.delete{background:transparent;border:0;color:var(--red);font-size:20px}
.empty{text-align:center;padding:30px 10px;color:var(--muted);line-height:1.8}
form{display:grid;gap:12px}
label{display:grid;gap:7px;color:var(--muted);font-size:12px}
input,select{
  width:100%;padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0e1828;color:var(--text);
}
input:focus,select:focus{outline:1px solid var(--accent)}
.add{width:100%;padding:13px}
.tip{
  margin-top:15px;padding:13px;
  background:#193744;border-radius:12px;
  color:#bdebf0;font-size:12px;line-height:1.8;
}
footer{text-align:center;color:#73839b;font-size:11px;padding:25px 0 5px}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:480px){
  .app{padding:13px}
  h1{font-size:18px}
  .hero{padding:17px}
  .hero h2{font-size:20px}
  .progress{width:75px;height:75px}
  .stats{gap:7px}
  .stat{padding:11px}
  .stat strong{font-size:21px}
  #weekLabel{min-width:95px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <h1>MY WEEK – Y MANKOUR</h1>
      <p>خطّط لأسبوعك وحقق أهدافك</p>
    </div>
  </div>
  <div id="today"></div>
</header>

<section class="hero">
  <div>
    <h2>أسبوع منظم، إنجاز أكبر ✨</h2>
    <p>نظم وقتك، أضف أهدافك، وتابع تقدمك كل يوم.</p>
  </div>
  <div class="progress-area">
    <div class="progress" id="progress">
      <strong id="percent">0%</strong>
    </div>
    <small>نسبة الإنجاز</small>
  </div>
</section>

<section class="stats">
  <div class="stat">
    <span>كل المهام</span>
    <strong id="total">0</strong>
  </div>
  <div class="stat">
    <span>المكتملة</span>
    <strong id="completed">0</strong>
  </div>
  <div class="stat">
    <span>المتبقية</span>
    <strong id="remaining">0</strong>
  </div>
</section>

<div class="toolbar">
  <h2>جدولي الأسبوعي</h2>
  <div class="controls">
    <button class="btn" id="prev">›</button>
    <span id="weekLabel"></span>
    <button class="btn" id="next">‹</button>
    <button class="btn" id="current">هذا الأسبوع</button>
  </div>
</div>

<div class="days" id="days"></div>

<div class="layout">

<section class="panel">
  <div class="panel-head">
    <h3 id="dayTitle">مهام اليوم</h3>
    <span class="muted" id="taskCount">0 مهام</span>
  </div>
  <div class="task-list" id="taskList"></div>
</section>

<section class="panel">
  <div class="panel-head">
    <h3>＋ إضافة مهمة</h3>
  </div>

  <form id="taskForm">
    <label>اسم المهمة
      <input id="taskName" maxlength="90"
      placeholder="مثلاً: مراجعة الرياضيات" required>
    </label>

    <label>الوقت
      <input id="taskTime" type="time">
    </label>

    <label>التصنيف
      <select id="category">
        <option>الدراسة</option>
        <option>الرياضة</option>
        <option>العمل</option>
        <option>الصحة</option>
        <option>الراحة</option>
        <option>شخصي</option>
        <option>أخرى</option>
      </select>
    </label>

    <button class="btn primary add" type="submit">
      ＋ إضافة إلى الجدول
    </button>
  </form>

  <div class="tip">
    💡 نصيحة: نظم مهامك حسب الأولوية، واترك وقتاً للراحة.
  </div>
</section>

</div>

<footer>MY WEEK – Y MANKOUR © 2026</footer>
</div>

<script>
const names=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const shortNames=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const key="my_week_y_mankour_tasks";

let tasks=[];
try{
  tasks=JSON.parse(localStorage.getItem(key))||[];
}catch(e){
  tasks=[];
}

let start=getStart(new Date());
let selected=new Date();

function dateKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getStart(d){
  let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-x.getDay());
  return x;
}

function save(){
  localStorage.setItem(key,JSON.stringify(tasks));
}

function format(d){
  return d.toLocaleDateString("ar-MA",{day:"numeric",month:"short"});
}

function render(){
  document.getElementById("today").textContent=
    new Date().toLocaleDateString("ar-MA",{weekday:"long",day:"numeric",month:"long"});

  let end=new Date(start);
  end.setDate(end.getDate()+6);

  document.getElementById("weekLabel").textContent=
    format(start)+" - "+format(end);

  renderDays();
  renderTasks();
  renderStats();
}

function renderDays(){
  const box=document.getElementById("days");
  box.innerHTML="";
  const today=dateKey(new Date());

  for(let i=0;i<7;i++){
    let d=new Date(start);
    d.setDate(d.getDate()+i);

    let b=document.createElement("button");
    b.className="day";
    if(dateKey(d)===dateKey(selected))b.classList.add("active");
    if(dateKey(d)===today)b.classList.add("today");

    b.innerHTML="<span>"+shortNames[d.getDay()]+"</span><strong>"+d.getDate()+"</strong>";

    b.onclick=()=>{
      selected=d;
      renderDays();
      renderTasks();
    };

    box.appendChild(b);
  }
}

function renderTasks(){
  const list=tasks
    .filter(t=>t.date===dateKey(selected))
    .sort((a,b)=>(a.time||"").localeCompare(b.time||""));

  document.getElementById("dayTitle").textContent=
    "مهام "+names[selected.getDay()]+" · "+format(selected);

  document.getElementById("taskCount").textContent=list.length+" مهام";

  const box=document.getElementById("taskList");
  box.innerHTML="";

  if(!list.length){
    box.innerHTML='<div class="empty">لا توجد مهام لهذا اليوم.<br>أضف مهمتك الأولى ✨</div>';
    return;
  }

  list.forEach(t=>{
    const row=document.createElement("div");
    row.className="task"+(t.done?" done":"");

    const check=document.createElement("input");
    check.type="checkbox";
    check.checked=t.done;
    check.onchange=()=>{
      t.done=check.checked;
      save();
      render();
    };

    const main=document.createElement("div");
    main.className="task-main";

    const title=document.createElement("div");
    title.className="task-name";
    title.textContent=t.name;

    const meta=document.createElement("div");
    meta.className="meta";

    const time=document.createElement("span");
    time.className="tag";
    time.textContent=t.time||"دون وقت";

    const category=document.createElement("span");
    category.className="tag";
    category.textContent=t.category;

    meta.append(time,category);
    main.append(title,meta);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="×";
    del.title="حذف المهمة";
    del.onclick=()=>{
      if(confirm("هل تريد حذف هذه المهمة؟")){
        tasks=tasks.filter(x=>x.id!==t.id);
        save();
        render();
      }
    };

    row.append(check,main,del);
    box.appendChild(row);
  });
}

function renderStats(){
  let end=new Date(start);
  end.setDate(end.getDate()+7);

  const weekTasks=tasks.filter(t=>{
    const d=new Date(t.date+"T00:00:00");
    return d>=start && d<end;
  });

  const done=weekTasks.filter(t=>t.done).length;
  const total=weekTasks.length;
  const percent=total?Math.round(done/total*100):0;

  document.getElementById("total").textContent=total;
  document.getElementById("completed").textContent=done;
  document.getElementById("remaining").textContent=total-done;
  document.getElementById("percent").textContent=percent+"%";
  document.getElementById("progress").style.setProperty("--percent",percent+"%");
}

document.getElementById("taskForm").onsubmit=e=>{
  e.preventDefault();

  const name=document.getElementById("taskName").value.trim();
  if(!name)return;

  tasks.push({
    id:Date.now().toString()+Math.random(),
    name:name,
    time:document.getElementById("taskTime").value,
    category:document.getElementById("category").value,
    date:dateKey(selected),
    done:false
  });

  save();
  e.target.reset();
  render();
};

document.getElementById("prev").onclick=()=>{
  start.setDate(start.getDate()-7);
  selected=new Date(start);
  render();
};

document.getElementById("next").onclick=()=>{
  start.setDate(start.getDate()+7);
  selected=new Date(start);
  render();
};

document.getElementById("current").onclick=()=>{
  start=getStart(new Date());
  selected=new Date();
  render();
};

render();
</script>
</body>
</html>
